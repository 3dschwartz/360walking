<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>360° Panorama Viewer</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; font-family: Arial, sans-serif; }
  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 8px;
    font-size: 0.85em; z-index: 998; pointer-events: none; text-align: center;
  }
  #debug-badge {
    display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #0f8; padding: 6px 14px; border-radius: 8px;
    font-size: 0.85em; z-index: 998; font-family: monospace;
  }
  /* Navigations-Menü auf der linken Bildseite */
  #menu {
    position: fixed; left: 12px; top: 50%; transform: translateY(-50%);
    z-index: 999; display: flex; flex-direction: column; gap: 8px;
  }
  .menu-item {
    color: #fff; background: rgba(0,0,0,0.55); padding: 8px 16px; border-radius: 8px;
    cursor: pointer; user-select: none; font-size: 0.95em; transition: background 0.15s;
  }
  .menu-item:hover { background: rgba(0,0,0,0.85); }
  .menu-item.active { background: #00c8ff; color: #000; font-weight: bold; }
</style>
</head>
<body>

<div id="menu"></div>
<div id="info">Links im Menü auf einen Eintrag klicken, um das Panorama zu wechseln &ndash; Taste P: Blickrichtung auslesen</div>
<div id="debug-badge"></div>

<script>
/* ============================================================================
   KONFIGURATION  –  HIER EINTRÄGE BEARBEITEN, NICHTS WEITER UNTEN IM HTML!
   ----------------------------------------------------------------------------
   Pro Panorama ein Block in der Liste PANORAMAS:

     id:      eindeutiger Name (frei wählbar, keine Leerzeichen)
     file:    Dateiname des Panorama-Bildes (muss neben der index.html liegen)
     label:   Textzeile im Menü auf der linken Bildseite
     viewYaw: Blickrichtung der Kamera beim Laden, in Grad (0 = geradeaus/-Z).
              Mit Taste P bestimmen: P drücken, im Bild auf die gewünschte
              Richtung klicken, Wert hier eintragen.
   ============================================================================ */

const PANORAMAS = [
  { id: 'pano1', file: 'pano_01.JPG', label: 'Eingang / Raum 1', viewYaw: 0 },
  { id: 'pano2', file: 'pano_02.JPG', label: 'Küche',            viewYaw: 0 },
  { id: 'pano3', file: 'pano_03.JPG', label: 'Wohnzimmer',       viewYaw: 0 }
];

/* ===================== Ende der Konfiguration ============================ */


// Laedt ein Panorama und richtet die Kamera auf die konfigurierte Blickrichtung.
function loadPano(id) {
  const pano = PANORAMAS.find(p => p.id === id);
  if (!pano) return;

  document.querySelector('#sky').setAttribute('src', '#' + id);

  const cameraRig = document.querySelector('#cameraRig');
  const camera = document.querySelector('#camera');
  cameraRig.setAttribute('rotation', `0 ${pano.viewYaw} 0`);
  // Kamera-Eigenrotation (z. B. durch Maus-Drehen) zurücksetzen,
  // sonst addiert sie sich auf die Rig-Drehung.
  camera.setAttribute('rotation', '0 0 0');

  // Aktiven Menüeintrag hervorheben
  document.querySelectorAll('.menu-item').forEach((el) => {
    el.classList.toggle('active', el.dataset.panoId === id);
  });
}

// Erzeugt die <img>-Assets für alle konfigurierten Panoramen
function buildAssets() {
  const assets = document.querySelector('a-assets');
  PANORAMAS.forEach((p) => {
    const img = document.createElement('img');
    img.setAttribute('id', p.id);
    img.setAttribute('crossorigin', 'anonymous');
    img.setAttribute('src', p.file);
    assets.appendChild(img);
  });
}

// Erzeugt das Navigations-Menü auf der linken Bildseite
function buildMenu() {
  const menu = document.getElementById('menu');
  PANORAMAS.forEach((p) => {
    const item = document.createElement('div');
    item.className = 'menu-item';
    item.dataset.panoId = p.id;
    item.textContent = p.label;
    item.addEventListener('click', () => loadPano(p.id));
    menu.appendChild(item);
  });
}

// Snap-Turn: rechter Controller-Stick nach links/rechts drücken dreht die
// Ansicht in festen Schritten (angenehmer für VR als stufenloses Drehen).
AFRAME.registerComponent('snap-turn', {
  schema: {
    turnDegrees: { type: 'number', default: 45 },
    deadzone: { type: 'number', default: 0.5 }
  },
  init: function () {
    this.readyToTurn = true;
    this.onAxisMove = this.onAxisMove.bind(this);
    this.el.addEventListener('thumbstickmoved', this.onAxisMove);
    this.el.addEventListener('axismove', this.onAxisMove);
  },
  onAxisMove: function (evt) {
    // Je nach Controller-Mapping liefert entweder 'thumbstickmoved' (x/y direkt)
    // oder 'axismove' (Array, Thumbstick meist an Index 2/3) die Stick-Werte.
    let x;
    if (evt.detail.x !== undefined) {
      x = evt.detail.x;
    } else if (evt.detail.axis && evt.detail.axis.length >= 4) {
      x = evt.detail.axis[2];
    } else if (evt.detail.axis && evt.detail.axis.length >= 2) {
      x = evt.detail.axis[0];
    } else {
      return;
    }

    const cameraRig = document.querySelector('#cameraRig');
    if (Math.abs(x) < this.data.deadzone) {
      this.readyToTurn = true;
      return;
    }
    if (!this.readyToTurn) return;

    const degrees = x > 0 ? -this.data.turnDegrees : this.data.turnDegrees;
    cameraRig.object3D.rotation.y += THREE.MathUtils.degToRad(degrees);
    this.readyToTurn = false;
  }
});
</script>

<a-scene vr-mode-ui="enabled: true">

  <a-assets timeout="10000">
    <!-- Panorama-Bilder werden automatisch aus der Konfiguration erzeugt -->
  </a-assets>

  <a-sky id="sky" rotation="0 -90 0"></a-sky>

  <!-- Rechter Controller nur noch für Snap-Turn (keine klickbaren Objekte mehr in der Szene) -->
  <a-entity id="rightHand" snap-turn="turnDegrees: 45"></a-entity>

  <a-entity id="cameraRig" position="0 1.6 0">
    <a-camera id="camera" look-controls wasd-controls="enabled: false">
    </a-camera>
  </a-entity>

</a-scene>

<script>
  // Blickrichtungs-Finder: Taste "P" toggelt den Debug-Modus. Im Debug-Modus
  // auf eine Stelle im Panorama klicken – angezeigt wird der viewYaw-Wert
  // (Grad), den du in die PANORAMAS-Liste oben in der Datei übernimmst.
  let debugMode = false;

  function setupYawFinder() {
    const sceneEl = document.querySelector('a-scene');
    const skyEl = document.querySelector('#sky');
    const badge = document.getElementById('debug-badge');
    const raycaster = new THREE.Raycaster();
    raycaster.far = 6000; // Sky-Radius ist standardmaessig 5000
    const mouse = new THREE.Vector2();

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() !== 'p') return;
      debugMode = !debugMode;
      badge.style.display = debugMode ? 'block' : 'none';
      badge.textContent = debugMode
        ? 'Blickrichtungs-Finder AN – ins Bild klicken, um viewYaw zu bestimmen'
        : '';
    });

    sceneEl.canvas.addEventListener('click', (evt) => {
      if (!debugMode) return;

      const rect = sceneEl.canvas.getBoundingClientRect();
      mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;

      const camera = sceneEl.camera;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(skyEl.getObject3D('mesh'), false);
      if (!hits.length) return;

      // Horizontale Blickrichtung (Yaw) aus der Richtung des Klick-Strahls:
      // 0° = Blick nach -Z, positive Werte drehen nach links (gegen Uhrzeigersinn).
      const dir = raycaster.ray.direction;
      const yaw = Math.atan2(-dir.x, -dir.z) * 180 / Math.PI;
      const yawRounded = Math.round(yaw * 10) / 10;

      const currentPano = (skyEl.getAttribute('src') || '').replace('#', '');
      badge.textContent = `viewYaw: ${yawRounded}  (für "${currentPano}" in die Konfiguration übernehmen)`;
      console.log(`viewYaw für ${currentPano}:`, yawRounded);
    });
  }

  document.querySelector('a-scene').addEventListener('loaded', () => {
    buildAssets();
    buildMenu();
    setupYawFinder();
    loadPano(PANORAMAS[0].id); // Start-Panorama = erster Eintrag in der Konfiguration
  });
</script>

</body>
</html>
