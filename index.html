<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>360° Panorama Viewer</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; font-family: Arial, sans-serif; }
  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 8px;
    font-size: 0.85em; z-index: 998; pointer-events: none; text-align: center;
  }
  #debug-badge {
    display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #0f8; padding: 6px 14px; border-radius: 8px;
    font-size: 0.85em; z-index: 998; font-family: monospace;
  }
</style>
</head>
<body>

<div id="info">Hotspot anklicken (Maus/Touch) oder anvisieren (VR-Blick) &ndash; die Kamera richtet sich automatisch auf den n&auml;chsten Hotspot aus</div>
<div id="debug-badge"></div>

<script>
/* ============================================================================
   KONFIGURATION  –  HIER EINTRÄGE BEARBEITEN, NICHTS WEITER UNTEN IM HTML!
   ----------------------------------------------------------------------------
   Pro Marker ein Block in der Liste HOTSPOTS:

     id:        eindeutiger Name (frei wählbar, keine Leerzeichen)
     position:  "X Y Z"  – die mit Taste P ausgelesene Position
     text:      Beschriftung unter dem Marker (\n = Zeilenumbruch)
     visibleOn: ID des Panoramas, in dem der Marker sichtbar ist
     target:    ID des Panoramas, das beim Anklicken geladen wird

   Die Kamera schaut beim Betreten eines Panoramas automatisch auf den
   ERSTEN Marker in dieser Liste, dessen visibleOn zum Panorama passt.
   (faceYaw, optional: eigene Blickrichtung in Grad statt Auto-Ausrichtung)
   ============================================================================ */

const HOTSPOTS = [
  {
    id: 'hotspot-to-2',
    position: '1.05 0.03 -3.34',   // <-- Position mit Taste P ausgelesen
    text: 'Höhe: 1.90 m\nRichtung AAAA',
    visibleOn: 'pano1',
    target: 'pano2'
  },
  {
    id: 'hotspot-to-3',
    position: '-2 0 -3',
    text: 'Höhe: 1.60 m\BBBBBB',
    visibleOn: 'pano2',
    target: 'pano3'
  },
  {
    id: 'hotspot-to-1',
    position: '0 0 3',
    text: 'Höhe: 1.60 m\CCCCCCC',
    visibleOn: 'pano3',
    target: 'pano1'
  }
];

/* ===================== Ende der Konfiguration ============================ */


// Custom Component: laedt beim Klick/Fuse-Klick ein neues Panorama-Bild
// und blendet nur die zum jeweils aktiven Panorama passenden Hotspots ein.
AFRAME.registerComponent('hotspot-loader', {
  schema: {
    target: { type: 'selector' },     // Bild-Asset, das beim Klick geladen wird
    visibleOn: { type: 'selector' }   // Bild-Asset, bei dem dieser Hotspot sichtbar sein soll
  },
  init: function () {
    const sky = document.querySelector('#sky');

    this.el.addEventListener('click', () => {
      if (!this.data.target) return;
      const targetId = this.data.target.getAttribute('id');
      sky.setAttribute('src', '#' + targetId);
      updateHotspotVisibility(targetId);
      // Kamera automatisch auf den ersten Hotspot des neuen Panoramas ausrichten
      faceFirstHotspot(targetId);
    });
  }
});

// Baut aus dem Hotspot sichtbar / unsichtbar, je nach aktivem Panorama
function updateHotspotVisibility(activePanoId) {
  document.querySelectorAll('[hotspot-loader]').forEach((el) => {
    const comp = el.components['hotspot-loader'];
    const visibleOnId = comp && comp.data.visibleOn ? comp.data.visibleOn.getAttribute('id') : null;
    const shouldBeVisible = visibleOnId === activePanoId;
    el.setAttribute('visible', shouldBeVisible);
    if (el.object3D) el.object3D.visible = shouldBeVisible;
  });

  // Raycaster-Objektlisten der Cursor auffrischen, damit neu sichtbare
  // Hotspots zuverlässig erkannt werden (Cache-Refresh nach dem Umschalten).
  ['#mouseCursor', '#leftHand', '#rightHand'].forEach((sel) => {
    const el = document.querySelector(sel);
    if (el && el.components && el.components.raycaster) {
      el.components.raycaster.refreshObjects();
    }
  });
}

// Dreht die Kamera so, dass der erste sichtbare Hotspot des Panoramas
// exakt in der Bildmitte liegt (nur horizontale Ausrichtung / Yaw).
function faceFirstHotspot(panoId) {
  const hs = HOTSPOTS.find(h => h.visibleOn === panoId);
  const cameraRig = document.querySelector('#cameraRig');
  const camera = document.querySelector('#camera');
  if (!hs || !cameraRig) return;

  let yaw;
  if (hs.faceYaw !== undefined) {
    yaw = hs.faceYaw; // manuelle Vorgabe aus der Konfiguration
  } else {
    const parts = hs.position.trim().split(/\s+/).map(Number);
    const x = parts[0], z = parts[2];
    // Yaw-Winkel, mit dem die Blickrichtung (-Z) auf den Punkt (x,z) zeigt
    yaw = Math.atan2(-x, -z) * 180 / Math.PI;
  }

  cameraRig.setAttribute('rotation', `0 ${yaw.toFixed(2)} 0`);
  // Kamera-Eigenrotation (z. B. durch Maus-Drehen) zurücksetzen,
  // sonst addiert sie sich auf die Rig-Drehung und der Marker wandert aus der Mitte.
  if (camera) camera.setAttribute('rotation', '0 0 0');
}

// Erzeugt die Hotspot-Entities aus der Konfigurationsliste HOTSPOTS
function buildHotspots() {
  const scene = document.querySelector('a-scene');
  HOTSPOTS.forEach((hs) => {
    const el = document.createElement('a-entity');
    el.setAttribute('id', hs.id);
    el.setAttribute('position', hs.position);
    el.setAttribute('geometry', 'primitive: ring; radiusInner: 0.25; radiusOuter: 0.4');
    el.setAttribute('material', 'color: #ffffff; shader: flat; side: double');
    el.setAttribute('look-at', '#camera');
    el.classList.add('clickable');
    el.setAttribute('hotspot-loader', `target: #${hs.target}; visibleOn: #${hs.visibleOn}`);

    const dot = document.createElement('a-entity');
    dot.classList.add('clickable');
    dot.setAttribute('geometry', 'primitive: circle; radius: 0.15');
    dot.setAttribute('material', 'color: #00c8ff; shader: flat; opacity: 0.85');
    dot.setAttribute('position', '0 0 0.01');
    el.appendChild(dot);

    const label = document.createElement('a-text');
    label.setAttribute('value', hs.text);
    label.setAttribute('align', 'center');
    label.setAttribute('width', '4.5');
    label.setAttribute('color', '#000000');
    label.setAttribute('position', '0 -0.7 0');
    label.setAttribute('look-at', '#camera');
    el.appendChild(label);

    scene.appendChild(el);
  });
}

// Snap-Turn: rechter Controller-Stick nach links/rechts drücken dreht die
// Ansicht in festen Schritten (angenehmer für VR als stufenloses Drehen).
AFRAME.registerComponent('snap-turn', {
  schema: {
    turnDegrees: { type: 'number', default: 45 },
    deadzone: { type: 'number', default: 0.5 }
  },
  init: function () {
    this.readyToTurn = true;
    this.onAxisMove = this.onAxisMove.bind(this);
    this.el.addEventListener('thumbstickmoved', this.onAxisMove);
    this.el.addEventListener('axismove', this.onAxisMove);
  },
  onAxisMove: function (evt) {
    // Je nach Controller-Mapping liefert entweder 'thumbstickmoved' (x/y direkt)
    // oder 'axismove' (Array, Thumbstick meist an Index 2/3) die Stick-Werte.
    let x;
    if (evt.detail.x !== undefined) {
      x = evt.detail.x;
    } else if (evt.detail.axis && evt.detail.axis.length >= 4) {
      x = evt.detail.axis[2];
    } else if (evt.detail.axis && evt.detail.axis.length >= 2) {
      x = evt.detail.axis[0];
    } else {
      return;
    }

    const cameraRig = document.querySelector('#cameraRig');
    if (Math.abs(x) < this.data.deadzone) {
      this.readyToTurn = true;
      return;
    }
    if (!this.readyToTurn) return;

    const degrees = x > 0 ? -this.data.turnDegrees : this.data.turnDegrees;
    cameraRig.object3D.rotation.y += THREE.MathUtils.degToRad(degrees);
    this.readyToTurn = false;
  }
});
</script>

<a-scene vr-mode-ui="enabled: true">

  <a-assets timeout="10000">
    <img id="pano1" crossorigin="anonymous" src="pano_01.JPG">
    <img id="pano2" crossorigin="anonymous" src="pano_02.JPG">
    <img id="pano3" crossorigin="anonymous" src="pano_03.JPG">
  </a-assets>

  <a-sky id="sky" src="#pano1" rotation="0 -90 0"></a-sky>

  <!-- Maus-/Touch-Cursor: reagiert auf die tatsächliche Zeiger-/Fingerposition (Desktop & Mobile) -->
  <a-entity id="mouseCursor"
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: .clickable; far: 50">
  </a-entity>

  <!-- Controller-Laserstrahlen für VR-Handcontroller (z.B. Quest 3): Zeigen + Trigger-Taste = Klick -->
  <a-entity id="leftHand" laser-controls="hand: left"
            raycaster="objects: .clickable; far: 50"
            line="color: #00c8ff; opacity: 0.75">
  </a-entity>
  <a-entity id="rightHand" laser-controls="hand: right"
            raycaster="objects: .clickable; far: 50"
            line="color: #00c8ff; opacity: 0.75"
            snap-turn="turnDegrees: 45">
  </a-entity>

  <a-entity id="cameraRig" position="0 1.6 0">
    <a-camera id="camera" look-controls wasd-controls="enabled: false">
    </a-camera>
  </a-entity>

</a-scene>

<script>
  // Positions-Finder: Taste "P" toggelt den Debug-Modus. Im Debug-Modus zeigt ein
  // Klick auf das Panorama die 3D-Koordinaten der angeklickten Stelle an, die man
  // direkt in die HOTSPOTS-Liste oben in der Datei übernehmen kann.
  let debugMode = false;
  const HOTSPOT_RADIUS = 3.5; // Abstand der Hotspots von der Kamera (an bestehende Werte angelehnt)

  function setupPositionFinder() {
    const sceneEl = document.querySelector('a-scene');
    const skyEl = document.querySelector('#sky');
    const badge = document.getElementById('debug-badge');
    const raycaster = new THREE.Raycaster();
    raycaster.far = 6000; // Sky-Radius ist standardmaessig 5000
    const mouse = new THREE.Vector2();

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() !== 'p') return;
      debugMode = !debugMode;
      badge.style.display = debugMode ? 'block' : 'none';
      badge.textContent = debugMode
        ? 'Positions-Finder AN – auf das Panorama klicken'
        : '';
    });

    sceneEl.canvas.addEventListener('click', (evt) => {
      if (!debugMode) return;

      const rect = sceneEl.canvas.getBoundingClientRect();
      mouse.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;

      const camera = sceneEl.camera;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(skyEl.getObject3D('mesh'), false);
      if (!hits.length) return;

      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);

      const direction = hits[0].point.clone().sub(camPos).normalize();
      // WICHTIG: Die Richtung wurde relativ zur Kamera berechnet, also muss die
      // Kameraposition wieder addiert werden. Sonst liegt der Marker 1,6 m zu tief.
      const pos = camPos.clone().add(direction.multiplyScalar(HOTSPOT_RADIUS));

      const coords = `${pos.x.toFixed(2)} ${pos.y.toFixed(2)} ${pos.z.toFixed(2)}`;
      badge.textContent = `position="${coords}"  (siehe auch Konsole)`;
      console.log('Hotspot-Position:', coords);
    });
  }

  document.querySelector('a-scene').addEventListener('loaded', () => {
    buildHotspots();
    setupPositionFinder();
    const startPano = (document.querySelector('#sky').getAttribute('src') || '#pano1').replace('#', '');
    updateHotspotVisibility(startPano);
    faceFirstHotspot(startPano); // Startansicht: Blick auf den ersten Marker
  });
</script>

</body>
</html>
