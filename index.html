<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebXR Panorama Viewer</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <script>
    // ---------- Komponente: Dreht Marker/Text immer frontal zur Kamera (Billboard) ----------
    AFRAME.registerComponent('face-camera', {
      init: function () {
        this.camWorldPos = new THREE.Vector3();
      },
      tick: function () {
        const cam = document.querySelector('#cam');
        if (!cam) return;
        
        cam.object3D.getWorldPosition(this.camWorldPos);
        this.el.object3D.lookAt(this.camWorldPos);
      }
    });

    // ---------- Komponente: 20° Snap Turn für VR (Dreht das Rig) ----------
    AFRAME.registerComponent('vr-snap-turn', {
      schema: {
        angle: { type: 'number', default: 20 },
        threshold: { type: 'number', default: 0.6 }
      },
      init: function () {
        this.stickX = 0;
        this.canSnap = true;

        this.onAxisMove = this.onAxisMove.bind(this);
        this.el.addEventListener('thumbstickmoved', this.onAxisMove);
        this.el.addEventListener('axismove', this.onAxisMove);
      },
      onAxisMove: function (evt) {
        const detail = evt.detail || {};
        if (typeof detail.x === 'number') {
          this.stickX = detail.x;
        } else if (detail.axis && Array.isArray(detail.axis)) {
          this.stickX = detail.axis[0] || 0;
        }
      },
      tick: function () {
        const rig = document.querySelector('#rig');
        if (!rig) return;

        // Stick RECHTS -> Rig dreht nach rechts (-Angle)
        if (this.stickX > this.data.threshold && this.canSnap) {
          this.rotateRig(-this.data.angle);
          this.canSnap = false;
        } 
        // Stick LINKS -> Rig dreht nach links (+Angle)
        else if (this.stickX < -this.data.threshold && this.canSnap) {
          this.rotateRig(this.data.angle);
          this.canSnap = false;
        } 
        else if (Math.abs(this.stickX) < 0.2) {
          this.canSnap = true;
        }
      },
      rotateRig: function (deltaAngle) {
        const rig = document.querySelector('#rig');
        const rot = rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        rig.setAttribute('rotation', `${rot.x} ${rot.y + deltaAngle} ${rot.z}`);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>

  <a-scene
    id="scene"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    background="color: #000"
  >
    <a-assets timeout="15000">
      <img id="pano1" src="pano_01.JPG" crossorigin="anonymous">
      <img id="pano2" src="pano_02.JPG" crossorigin="anonymous">
      <img id="pano3" src="pano_03.JPG" crossorigin="anonymous">
    </a-assets>

    <!-- PANORAMA-CONTAINER (Zentriert auf Augenhöhe 1.6m) -->
    <a-entity id="pano-container" position="0 1.6 0">
      <a-sky
        id="sky"
        src="#pano1"
        radius="500"
        position="0 0 0"
        class="clickable"
      ></a-sky>

      <!-- Marker-Behälter -->
      <a-entity id="markers-container"></a-entity>
    </a-entity>

    <!-- CAMERA RIG (Steht am Boden 0,0,0) -->
    <a-entity id="rig" position="0 0 0">
      <a-camera
        id="cam"
        look-controls="
          enabled: true;
          magicWindowTrackingEnabled: true;
          touchEnabled: true;
          mouseEnabled: true;
          pointerLockEnabled: false;
        "
        wasd-controls="enabled: false"
        position="0 1.6 0"
      >
        <!-- Maus/Touch Raycaster -->
        <a-entity
          cursor="fuse: false; rayOrigin: mouse"
          raycaster="objects: .clickable; far: 1000"
        ></a-entity>
      </a-camera>

      <!-- Linker Controller -->
      <a-entity
        id="leftHand"
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 1000; lineColor: #7dd3fc; lineOpacity: 0.6"
      ></a-entity>

      <!-- Rechter Controller (Snap Turn) -->
      <a-entity
        id="rightHand"
        laser-controls="hand: right"
        vr-snap-turn="angle: 20; threshold: 0.6"
        raycaster="objects: .clickable; far: 1000; lineColor: #7dd3fc; lineOpacity: 0.6"
      ></a-entity>
    </a-entity>

  </a-scene>

  <script>
    // =========================================================================
    // PANORAMA & MARKER KONFIGURATION
    // =========================================================================
    const PANORAMAS = {
      "pano1": {
        src: "#pano1",
        startRotation: "0 -90 0",
        markers: [
          { target: "pano2", position: "3 0 -5", label: "Zu Panorama 2" },
          { target: "pano3", position: "-3 0 -5", label: "Zu Panorama 3" }
        ]
      },
      "pano2": {
        src: "#pano2",
        startRotation: "0 0 0",
        markers: [
          { target: "pano1", position: "-3 0 5", label: "Zu Panorama 1" },
          { target: "pano3", position: "4 0 -3", label: "Zu Panorama 3" }
        ]
      },
      "pano3": {
        src: "#pano3",
        startRotation: "0 45 0",
        markers: [
          { target: "pano1", position: "3 0 5", label: "Zu Panorama 1" },
          { target: "pano2", position: "-4 0 -3", label: "Zu Panorama 2" }
        ]
      }
    };

    // =========================================================================
    // VIEWER LOGIK
    // =========================================================================
    (function () {
      const sky = document.querySelector('#sky');
      const panoContainer = document.querySelector('#pano-container');
      const markersContainer = document.querySelector('#markers-container');

      function loadPano(panoKey) {
        const config = PANORAMAS[panoKey];
        if (!config) return;

        sky.setAttribute('src', config.src);
        
        // Start-Blickwinkel des Panoramas setzen
        panoContainer.setAttribute('rotation', config.startRotation || "0 0 0");

        // Alte Marker entfernen
        markersContainer.innerHTML = '';

        // Neue Marker laden
        if (config.markers && Array.isArray(config.markers)) {
          config.markers.forEach(m => {
            const markerGroup = document.createElement('a-entity');
            markerGroup.setAttribute('position', m.position);
            
            // Immer frontal zur Kamera ausrichten
            markerGroup.setAttribute('face-camera', '');

            // Anklickbare Kugel
            const sphere = document.createElement('a-sphere');
            sphere.setAttribute('class', 'clickable');
            sphere.setAttribute('radius', '0.25');
            sphere.setAttribute('material', 'color: #0ea5e9; opacity: 0.85; shader: flat');
            sphere.setAttribute('animation__hover', 'property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 150');
            sphere.setAttribute('animation__leave', 'property: scale; to: 1 1 1; startEvents: mouseleave; dur: 150');

            // Äußerer Ring
            const ring = document.createElement('a-ring');
            ring.setAttribute('class', 'clickable');
            ring.setAttribute('radius-inner', '0.28');
            ring.setAttribute('radius-outer', '0.36');
            ring.setAttribute('material', 'color: #ffffff; side: double; shader: flat');

            // Text
            const text = document.createElement('a-text');
            text.setAttribute('value', m.label || m.target);
            text.setAttribute('align', 'center');
            text.setAttribute('position', '0 0.45 0');
            text.setAttribute('scale', '1.2 1.2 1.2');
            text.setAttribute('color', '#ffffff');

            markerGroup.appendChild(sphere);
            markerGroup.appendChild(ring);
            markerGroup.appendChild(text);

            // Klick-Event
            const handleClick = (evt) => {
              evt.stopPropagation();
              loadPano(m.target);
            };

            sphere.addEventListener('click', handleClick);
            ring.addEventListener('click', handleClick);

            markersContainer.appendChild(markerGroup);
          });
        }
      }

      loadPano("pano1");
    })();
  </script>
</body>
</html>
