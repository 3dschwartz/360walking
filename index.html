<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebXR Panorama Viewer</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <script>
    // ---------- Komponente: Richtet Marker automatisch immer zur Kamera aus ----------
    AFRAME.registerComponent('look-at-center', {
      tick: function () {
        const pos = this.el.object3D.position;
        // Dreht die Vorderseite (+Z) des Markers exakt zum Zentrum/zur Kamera (0,0,0)
        this.el.object3D.lookAt(pos.x * 2, pos.y * 2, pos.z * 2);
      }
    });

    // ---------- Komponente: 20° Snap Turn (VR-Schwindel vermeiden) ----------
    AFRAME.registerComponent('vr-snap-turn', {
      schema: {
        angle: { type: 'number', default: 20 },
        threshold: { type: 'number', default: 0.6 }
      },
      init: function () {
        this.stickX = 0;
        this.canSnap = true;

        this.onAxisMove = this.onAxisMove.bind(this);
        this.el.addEventListener('thumbstickmoved', this.onAxisMove);
        this.el.addEventListener('axismove', this.onAxisMove);
      },
      onAxisMove: function (evt) {
        const detail = evt.detail || {};
        if (typeof detail.x === 'number') {
          this.stickX = detail.x;
        } else if (detail.axis && Array.isArray(detail.axis)) {
          this.stickX = detail.axis[0] || 0;
        }
      },
      tick: function () {
        const container = document.querySelector('#pano-container');
        if (!container) return;

        // Stick RECHTS -> Panorama dreht sich nach links = Blick schaut nach RECHTS
        if (this.stickX > this.data.threshold && this.canSnap) {
          this.rotatePano(-this.data.angle);
          this.canSnap = false;
        } 
        // Stick LINKS -> Panorama dreht sich nach rechts = Blick schaut nach LINKS
        else if (this.stickX < -this.data.threshold && this.canSnap) {
          this.rotatePano(this.data.angle);
          this.canSnap = false;
        } 
        else if (Math.abs(this.stickX) < 0.2) {
          this.canSnap = true;
        }
      },
      rotatePano: function (deltaAngle) {
        const container = document.querySelector('#pano-container');
        const rot = container.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        container.setAttribute('rotation', `${rot.x} ${rot.y + deltaAngle} ${rot.z}`);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #000;
    }
    #ui-panel {
      display: none; /* Nur bei Taste P sichtbar */
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      background: rgba(15, 15, 25, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 14px 16px;
      color: #f0f0f0;
      width: min(360px, calc(100vw - 24px));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      line-height: 1.4;
    }
    #ui-panel h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #7dd3fc;
    }
    .field-group {
      margin-bottom: 10px;
    }
    .field-group label {
      display: block;
      font-size: 11px;
      color: #a5b4c8;
      margin-bottom: 4px;
    }
    .field-group input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }
    .hint {
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Mess-Panel (nur sichtbar bei Tastendruck P) -->
  <div id="ui-panel">
    <h1>Position-Sampler (Taste P)</h1>
    <div class="hint" style="margin-bottom: 8px;">
      Klicke an eine Stelle im Panorama, um die Daten für die Konfiguration zu lesen:
    </div>
    <div class="field-group">
      <label>Gelesene Koordinaten & Rotation (automatisch kopiert):</label>
      <input type="text" id="sample-output" readonly placeholder="Klicke ins Panorama...">
    </div>
    <div class="hint">Drücke erneut <kbd>P</kbd>, um dieses Fenster zu schließen.</div>
  </div>

  <a-scene
    id="scene"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    background="color: #000"
  >
    <a-assets timeout="15000">
      <img id="pano1" src="pano_01.JPG" crossorigin="anonymous">
      <img id="pano2" src="pano_02.JPG" crossorigin="anonymous">
      <img id="pano3" src="pano_03.JPG" crossorigin="anonymous">
    </a-assets>

    <!-- ZENTRIERTER PANORAMA-CONTAINER (Exakt auf Kamera-Augenhöhe 1.6m) -->
    <a-entity id="pano-container" position="0 1.6 0">
      <a-sky
        id="sky"
        src="#pano1"
        radius="500"
        position="0 0 0"
        class="clickable"
      ></a-sky>

      <!-- Marker-Behälter auf gleicher Ebene wie Panorama -->
      <a-entity id="markers-container"></a-entity>
    </a-entity>

    <!-- ZENTRIERTES CAMERA RIG (Augenhöhe 1.6m) -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera
        id="cam"
        look-controls="
          enabled: true;
          magicWindowTrackingEnabled: true;
          touchEnabled: true;
          mouseEnabled: true;
          pointerLockEnabled: false;
        "
        wasd-controls="enabled: false"
        position="0 0 0"
      >
        <a-entity
          cursor="fuse: false; rayOrigin: mouse"
          raycaster="objects: .clickable; far: 1000"
        ></a-entity>
      </a-camera>

      <!-- Linker Controller -->
      <a-entity
        id="leftHand"
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 20; lineColor: #7dd3fc; lineOpacity: 0.6"
      ></a-entity>

      <!-- Rechter Controller (mit Korrektur: Stick Rechts = Blick nach Rechts) -->
      <a-entity
        id="rightHand"
        laser-controls="hand: right"
        vr-snap-turn="angle: 20; threshold: 0.6"
        raycaster="objects: .clickable; far: 20; lineColor: #7dd3fc; lineOpacity: 0.6"
      ></a-entity>
    </a-entity>

  </a-scene>

  <script>
    // =========================================================================
    // PANORAMA & MARKER KONFIGURATION
    // =========================================================================
    const PANORAMAS = {
      "pano1": {
        src: "#pano1",
        startRotation: "0 -90 0",
        markers: [
          { target: "pano2", position: "3 0 -5", label: "Zu Panorama 2" },
          { target: "pano3", position: "-3 0 -5", label: "Zu Panorama 3" }
        ]
      },
      "pano2": {
        src: "#pano2",
        startRotation: "0 0 0",
        markers: [
          { target: "pano1", position: "-3 0 5", label: "Zu Panorama 1" },
          { target: "pano3", position: "4 0 -3", label: "Zu Panorama 3" }
        ]
      },
      "pano3": {
        src: "#pano3",
        startRotation: "0 45 0",
        markers: [
          { target: "pano1", position: "3 0 5", label: "Zu Panorama 1" },
          { target: "pano2", position: "-4 0 -3", label: "Zu Panorama 2" }
        ]
      }
    };

    // =========================================================================
    // VIEWER LOGIK
    // =========================================================================
    (function () {
      const sky = document.querySelector('#sky');
      const panoContainer = document.querySelector('#pano-container');
      const markersContainer = document.querySelector('#markers-container');
      const uiPanel = document.getElementById('ui-panel');
      const sampleOutput = document.getElementById('sample-output');

      let currentPanoKey = "pano1";
      let sampleMode = false;

      function loadPano(panoKey) {
        const config = PANORAMAS[panoKey];
        if (!config) return;

        currentPanoKey = panoKey;
        sky.setAttribute('src', config.src);
        
        // Start-Blickwinkel auf den Gesamtkörper anwenden
        panoContainer.setAttribute('rotation', config.startRotation || "0 0 0");

        // Alte Marker entfernen
        markersContainer.innerHTML = '';

        // Neue Marker laden
        if (config.markers && Array.isArray(config.markers)) {
          config.markers.forEach(m => {
            const markerEntity = document.createElement('a-entity');
            markerEntity.setAttribute('class', 'clickable');
            markerEntity.setAttribute('position', m.position);
            
            // Automatische Ausrichtung zur Kamera hinzufügen
            markerEntity.setAttribute('look-at-center', '');

            // Hotspot-Kugel
            const sphere = document.createElement('a-sphere');
            sphere.setAttribute('radius', '0.25');
            sphere.setAttribute('material', 'color: #0ea5e9; opacity: 0.85; shader: flat');
            sphere.setAttribute('animation__hover', 'property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 150');
            sphere.setAttribute('animation__leave', 'property: scale; to: 1 1 1; startEvents: mouseleave; dur: 150');

            // Ring
            const ring = document.createElement('a-ring');
            ring.setAttribute('radius-inner', '0.28');
            ring.setAttribute('radius-outer', '0.36');
            ring.setAttribute('material', 'color: #ffffff; side: double; shader: flat');

            // Text
            const text = document.createElement('a-text');
            text.setAttribute('value', m.label || m.target);
            text.setAttribute('align', 'center');
            text.setAttribute('position', '0 0.45 0');
            text.setAttribute('scale', '1.2 1.2 1.2');
            text.setAttribute('color', '#ffffff');

            markerEntity.appendChild(sphere);
            markerEntity.appendChild(ring);
            markerEntity.appendChild(text);

            markerEntity.addEventListener('click', (evt) => {
              evt.stopPropagation();
              if (sampleMode) return;
              loadPano(m.target);
            });

            markersContainer.appendChild(markerEntity);
          });
        }
      }

      function toggleSamplePanel() {
        sampleMode = !sampleMode;
        uiPanel.style.display = sampleMode ? 'block' : 'none';
        document.body.style.cursor = sampleMode ? 'crosshair' : '';
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          e.preventDefault();
          toggleSamplePanel();
        }
      });

      sky.addEventListener('click', (evt) => {
        if (!sampleMode) return;
        const inter = evt.detail && evt.detail.intersection;
        if (!inter) return;

        const dir = new THREE.Vector3(inter.point.x, inter.point.y, inter.point.z).normalize();
        const markerPos = dir.clone().multiplyScalar(5);

        const yaw = Math.atan2(-dir.x, -dir.z) * (180 / Math.PI);
        const pitch = Math.asin(dir.y) * (180 / Math.PI);

        const posStr = `${markerPos.x.toFixed(2)} ${markerPos.y.toFixed(2)} ${markerPos.z.toFixed(2)}`;
        const rotStr = `${pitch.toFixed(2)} ${yaw.toFixed(2)} 0`;

        sampleOutput.value = `position: "${posStr}" | startRotation: "${rotStr}"`;

        navigator.clipboard.writeText(`position: "${posStr}"`).then(() => {
          console.log('Position kopiert:', posStr);
        });
      });

      loadPano("pano1");
    })();
  </script>
</body>
</html>
