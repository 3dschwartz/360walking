<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebXR Panorama Viewer</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #000;
    }
    #ui-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      background: rgba(15, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 16px;
      color: #f0f0f0;
      width: min(340px, calc(100vw - 24px));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      font-size: 14px;
      line-height: 1.4;
    }
    #ui-panel h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #7dd3fc;
      letter-spacing: 0.02em;
    }
    .field-group {
      margin-bottom: 10px;
    }
    .field-group label {
      display: block;
      font-size: 12px;
      color: #a5b4c8;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .field-group input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field-group input:focus {
      border-color: #38bdf8;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:active {
      transform: scale(0.97);
    }
    #apply-btn {
      background: #0ea5e9;
      color: #fff;
    }
    #apply-btn:hover {
      background: #0284c7;
    }
    #sample-btn {
      background: #334155;
      color: #e2e8f0;
    }
    #sample-btn:hover {
      background: #475569;
    }
    #sample-btn.active {
      background: #f59e0b;
      color: #000;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.35;
    }
    .hint kbd {
      background: rgba(255, 255, 255, 0.12);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 11px;
    }
    /* Hide UI panel when in immersive VR (optional enhancement) */
    a-scene[data-is-vr="true"] ~ #ui-panel {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top control panel (desktop / mobile) -->
  <div id="ui-panel">
    <h1>Panorama Viewer (WebXR)</h1>

    <div class="field-group">
      <label for="alias-input">Alias-Name für Panorama</label>
      <input type="text" id="alias-input" placeholder="z.B. Eingangshalle" autocomplete="off">
    </div>

    <div class="field-group">
      <label for="viewpoint-input">Blickpunkt (aus Zwischenablage)</label>
      <input type="text" id="viewpoint-input" placeholder="Rotation z.B. 0 180 0" autocomplete="off">
    </div>

    <div class="btn-row">
      <button id="apply-btn" type="button">Blickpunkt anwenden</button>
      <button id="sample-btn" type="button">P – Punkt lesen</button>
    </div>

    <div class="hint">
      <kbd>P</kbd> drücken oder Button → dann in das Panorama klicken, um den Blickpunkt zu lesen und in die Zwischenablage zu kopieren.<br>
      Maus ziehen / Touch / VR-Headset: in alle Achsen schauen.
    </div>
  </div>

  <a-scene
    id="scene"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    background="color: #000"
    loading-screen="enabled: true"
  >
    <a-assets timeout="15000">
      <img id="pano1" src="pano_01.JPG" crossorigin="anonymous">
      <img id="pano2" src="pano_02.JPG" crossorigin="anonymous">
      <img id="pano3" src="pano_03.JPG" crossorigin="anonymous">
    </a-assets>

    <!-- Panorama sky -->
    <a-sky
      id="sky"
      src="#pano1"
      radius="500"
      rotation="0 -90 0"
      class="clickable"
    ></a-sky>

    <!-- Camera rig -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera
        id="cam"
        look-controls="
          enabled: true;
          magicWindowTrackingEnabled: true;
          touchEnabled: true;
          mouseEnabled: true;
          pointerLockEnabled: false;
        "
        wasd-controls="enabled: false"
        position="0 0 0"
      >
        <!-- Mouse / touch raycaster for desktop & mobile -->
        <a-entity
          cursor="fuse: false; rayOrigin: mouse"
          raycaster="objects: .clickable; far: 1000"
        ></a-entity>
      </a-camera>
    </a-entity>

    <!-- VR / XR controllers with laser -->
    <a-entity
      id="leftHand"
      laser-controls="hand: left"
      raycaster="objects: .clickable; far: 10; lineColor: #7dd3fc; lineOpacity: 0.6"
    ></a-entity>
    <a-entity
      id="rightHand"
      laser-controls="hand: right"
      raycaster="objects: .clickable; far: 10; lineColor: #7dd3fc; lineOpacity: 0.6"
    ></a-entity>

    <!-- 3D Menu – visible on all devices including VR headsets -->
    <a-entity id="menu" position="-1.8 1.5 -1.2" rotation="0 25 0">
      <!-- Title -->
      <a-text
        value="Panoramen"
        position="0 0.55 0.01"
        align="center"
        width="3.2"
        color="#7dd3fc"
        font="kelsonsans"
      ></a-text>

      <!-- Button 1 -->
      <a-entity
        class="clickable menu-btn"
        data-pano="1"
        position="0 0.25 0"
        geometry="primitive: plane; width: 1.4; height: 0.32"
        material="color: #1e293b; opacity: 0.92; shader: flat"
        animation__hover="property: scale; to: 1.05 1.05 1.05; startEvents: mouseenter; dur: 120"
        animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 120"
      >
        <a-text
          value="1 – pano_01"
          align="center"
          width="2.8"
          color="#e2e8f0"
          position="0 0 0.01"
        ></a-text>
      </a-entity>

      <!-- Button 2 -->
      <a-entity
        class="clickable menu-btn"
        data-pano="2"
        position="0 -0.12 0"
        geometry="primitive: plane; width: 1.4; height: 0.32"
        material="color: #1e293b; opacity: 0.92; shader: flat"
        animation__hover="property: scale; to: 1.05 1.05 1.05; startEvents: mouseenter; dur: 120"
        animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 120"
      >
        <a-text
          value="2 – pano_02"
          align="center"
          width="2.8"
          color="#e2e8f0"
          position="0 0 0.01"
        ></a-text>
      </a-entity>

      <!-- Button 3 -->
      <a-entity
        class="clickable menu-btn"
        data-pano="3"
        position="0 -0.49 0"
        geometry="primitive: plane; width: 1.4; height: 0.32"
        material="color: #1e293b; opacity: 0.92; shader: flat"
        animation__hover="property: scale; to: 1.05 1.05 1.05; startEvents: mouseenter; dur: 120"
        animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 120"
      >
        <a-text
          value="3 – pano_03"
          align="center"
          width="2.8"
          color="#e2e8f0"
          position="0 0 0.01"
        ></a-text>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    (function () {
      const sky = document.querySelector('#sky');
      const cam = document.querySelector('#cam');
      const scene = document.querySelector('#scene');
      const aliasInput = document.getElementById('alias-input');
      const viewpointInput = document.getElementById('viewpoint-input');
      const applyBtn = document.getElementById('apply-btn');
      const sampleBtn = document.getElementById('sample-btn');

      let sampleMode = false;
      let currentPano = 1;

      // ---------- Switch panorama ----------
      function loadPano(n) {
        currentPano = n;
        const id = '#pano' + n;
        sky.setAttribute('src', id);

        // Highlight active button
        document.querySelectorAll('.menu-btn').forEach(btn => {
          const isActive = btn.dataset.pano === String(n);
          btn.setAttribute('material', `color: ${isActive ? '#0ea5e9' : '#1e293b'}; opacity: 0.92; shader: flat`);
        });
      }

      // Menu clicks
      document.querySelectorAll('.menu-btn').forEach(btn => {
        btn.addEventListener('click', (evt) => {
          evt.stopPropagation();
          const n = parseInt(btn.dataset.pano, 10);
          loadPano(n);
        });
      });

      // ---------- Sample viewpoint (key P or button) ----------
      function setSampleMode(on) {
        sampleMode = on;
        sampleBtn.classList.toggle('active', on);
        sampleBtn.textContent = on ? 'Klicke jetzt im Bild…' : 'P – Punkt lesen';
        document.body.style.cursor = on ? 'crosshair' : '';
      }

      function sampleViewpoint(intersection) {
        if (!intersection) return;

        // intersection.point is in world space on the sky sphere
        // We compute the direction from origin (camera is near origin) to that point
        // and convert to Euler rotation that the camera should have to look there.
        const point = intersection.point;
        const dir = new THREE.Vector3(point.x, point.y, point.z).normalize();

        // A-Frame / Three.js camera looks down -Z by default.
        // Convert direction to yaw (Y) and pitch (X)
        const yaw = Math.atan2(-dir.x, -dir.z) * (180 / Math.PI);   // degrees
        const pitch = Math.asin(dir.y) * (180 / Math.PI);           // degrees

        // Format: "pitch yaw 0"  (A-Frame rotation order is typically YXZ / pitch yaw roll)
        // A-Frame rotation attribute is "x y z" = pitch yaw roll
        const rotStr = `${pitch.toFixed(2)} ${yaw.toFixed(2)} 0`;

        // Also include UV for completeness (useful for some pipelines)
        let uvStr = '';
        if (intersection.uv) {
          uvStr = ` | UV: ${intersection.uv.x.toFixed(4)},${intersection.uv.y.toFixed(4)}`;
        }

        const full = rotStr + uvStr;

        // Copy pure rotation string (most useful for applying later)
        navigator.clipboard.writeText(rotStr).then(() => {
          viewpointInput.value = rotStr;
          console.log('Blickpunkt kopiert:', full);
          // Brief visual feedback
          sampleBtn.textContent = 'Kopiert!';
          setTimeout(() => setSampleMode(false), 900);
        }).catch(err => {
          console.warn('Clipboard fehlgeschlagen, Wert trotzdem gesetzt:', err);
          viewpointInput.value = rotStr;
          setSampleMode(false);
        });
      }

      // Click on sky while in sample mode
      sky.addEventListener('click', (evt) => {
        if (!sampleMode) return;
        const inter = evt.detail && evt.detail.intersection;
        if (inter) {
          sampleViewpoint(inter);
        }
      });

      // Keyboard P
      window.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') {
          // Ignore if typing in an input
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          e.preventDefault();
          setSampleMode(!sampleMode);
        }
      });

      sampleBtn.addEventListener('click', () => {
        setSampleMode(!sampleMode);
      });

      // ---------- Apply viewpoint ----------
      applyBtn.addEventListener('click', () => {
        const val = viewpointInput.value.trim();
        if (!val) return;

        // Accept either "pitch yaw roll" or just "pitch yaw"
        const parts = val.split(/[\s,;]+/).map(parseFloat).filter(n => !isNaN(n));
        if (parts.length < 2) {
          alert('Ungültiges Format. Erwarte z.B. „12.34 -90.00 0“');
          return;
        }

        const pitch = parts[0];
        const yaw = parts[1];
        const roll = parts[2] || 0;

        // Temporarily disable look-controls so we can set rotation cleanly
        const lookControls = cam.components['look-controls'];
        if (lookControls) {
          lookControls.pause();
        }

        cam.setAttribute('rotation', { x: pitch, y: yaw, z: roll });

        // Re-enable after a short delay so the new orientation is kept
        setTimeout(() => {
          if (lookControls) {
            // Sync internal pitch/yaw of look-controls with the new rotation
            if (typeof lookControls.pitchObject !== 'undefined') {
              lookControls.pitchObject.rotation.x = THREE.MathUtils.degToRad(pitch);
              lookControls.yawObject.rotation.y = THREE.MathUtils.degToRad(yaw);
            }
            lookControls.play();
          }
        }, 50);

        // Optional: show alias somewhere – for now just log
        const alias = aliasInput.value.trim();
        if (alias) {
          console.log(`Alias „${alias}“ → Blickpunkt ${pitch.toFixed(2)} ${yaw.toFixed(2)} ${roll}`);
          document.title = `Panorama – ${alias}`;
        }
      });

      // ---------- Enter / exit VR detection (optional UI hide) ----------
      scene.addEventListener('enter-vr', () => {
        scene.dataset.isVr = 'true';
      });
      scene.addEventListener('exit-vr', () => {
        scene.dataset.isVr = 'false';
      });

      // Start with first panorama
      loadPano(1);

      // Make sure assets are loaded
      scene.addEventListener('loaded', () => {
        console.log('A-Frame Scene bereit. Bilder:', 
          document.querySelector('#pano1').complete,
          document.querySelector('#pano2').complete,
          document.querySelector('#pano3').complete
        );
      });
    })();
  </script>
</body>
</html>
