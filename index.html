<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>360° Panorama Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; font-family: Arial, sans-serif; }
  #loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 1.2em; z-index: 999; transition: opacity 0.4s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 8px;
    font-size: 0.85em; z-index: 998; pointer-events: none;
  }
</style>
</head>
<body>

<div id="loading">Panorama wird geladen...</div>
<div id="info">Hotspot anklicken (Maus/Touch) oder anvisieren (VR-Blick) zum Wechseln</div>

<!-- Bild-Assets: hier eigene Panorama-URLs eintragen -->
<a-scene loading-screen="enabled: false" vr-mode-ui="enabled: true">

  <a-assets timeout="10000">
    <img id="pano1" crossorigin="anonymous"
         src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg">
    <img id="pano2" crossorigin="anonymous"
         src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg">
  </a-assets>

  <!-- 360°-Himmelskugel -->
  <a-sky id="sky" src="#pano1" rotation="0 -90 0"></a-sky>

  <!-- Hotspot im 3D-Raum via X/Y/Z-Koordinaten -->
  <a-entity id="hotspot"
            position="2 0 -3"
            geometry="primitive: ring; radiusInner: 0.25; radiusOuter: 0.4"
            material="color: #ffffff; shader: flat; side: double"
            look-at="#camera"
            class="clickable"
            animation__pulse="property: scale; dir: alternate; dur: 800; loop: true; to: 1.15 1.15 1.15"
            hotspot-loader="target: #pano2">
    <a-entity geometry="primitive: circle; radius: 0.15"
              material="color: #00c8ff; shader: flat; opacity: 0.85"
              position="0 0 0.01"></a-entity>
  </a-entity>

  <!-- Kamera mit Gaze-Cursor für VR/Mobile/Desktop -->
  <a-entity id="cameraRig" position="0 1.6 0">
    <a-camera id="camera" look-controls wasd-controls="enabled: false">
      <a-entity cursor="fuse: true; fuseTimeout: 1200"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.014"
                material="color: #ffffff; shader: flat; opacity: 0.9"
                animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 200"
                animation__fusing="property: material.color; type: color; startEvents: fusing; from: #ffffff; to: #00c8ff; dur: 1200">
      </a-entity>
    </a-camera>
  </a-entity>

</a-scene>

<script>
  // Custom Component: lädt beim Klick/Fuse-Klick ein neues Panorama-Bild
  AFRAME.registerComponent('hotspot-loader', {
    schema: { target: { type: 'selector' } },
    init: function () {
      this.el.addEventListener('click', () => {
        const sky = document.querySelector('#sky');
        if (this.data.target) {
          sky.setAttribute('src', this.data.target);
        }
      });
    }
  });

  // Ladebildschirm ausblenden, sobald die Szene bereit ist
  document.querySelector('a-scene').addEventListener('loaded', () => {
    document.getElementById('loading').classList.add('hidden');
  });
</script>

</body>
</html>
